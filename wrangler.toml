# Configuración de Cloudflare Pages (producción en main; [env.preview] para ramas).
# Solo agrega la base de la Autopista a las Functions de /autopista/api/*.
# No usa ni conoce la base humagencia-score.
name = "humagencia-web"
pages_build_output_dir = "."
compatibility_date = "2026-10-16"

[vars]
APP_ORIGIN = "https://humagencia.com.ar"
ACCESS_ENABLED = "true"
MAIL_ENABLED = "true"
INGEST_ENABLED = "false"
MAILER_URL = "https://script.google.com/macros/s/AKfycbxwH3A8Ng_fWmRToycd9w7A5g8qlKjFDZOPzicHvKuPypTrlhZnLTYgOZnoU2QNDRKD/exec"
MAIL_DAILY_BUDGET = "50"

[[d1_databases]]
binding = "AUTOPISTA_DB"
database_name = "humagencia-autopista"
database_id = "a13baab4-9018-44b0-b094-4488b4d4271a"

[env.preview.vars]
APP_ORIGIN = "https://autopista-avisos.humagencia-web.pages.dev"
ACCESS_ENABLED = "true"
MAIL_ENABLED = "true"
INGEST_ENABLED = "false"
MAILER_URL = "https://script.google.com/macros/s/AKfycbxwH3A8Ng_fWmRToycd9w7A5g8qlKjFDZOPzicHvKuPypTrlhZnLTYgOZnoU2QNDRKD/exec"
MAIL_DAILY_BUDGET = "50"

[[env.preview.d1_databases]]
binding = "AUTOPISTA_DB"
database_name = "humagencia-autopista"
database_id = "a13baab4-9018-44b0-b094-4488b4d4271a"
